Agents:
    Spy:
        Parent Army:
            Useful Skills:
                Supplier:
                    - Ranks: [1, 2, 3]
                    - Description: replinishment. can be used as deployed too.
                Coordinator:
                    - Ranks: [3, 4, 5]
                    - Description: movement + reinforcement range
                Looter:
                    - Ranks: [3, 4, 5]
                    - Description: looting settlement gold
                Hunter:
                    - Ranks: [5, 6, 7]
                    - Description: movement range, missile damage and range
            Strategy:
                Start with supplier. Move to coordinator and then Hunter. 
                Looter looks like something made to looting settlements, 
                but public order problems after are way too high.
        Deployed:
            Useful Skills:
                Supplier:
                    - Ranks: [ 1, 2, 3 ]
                    - Description: replinishment. can be used as deployed too.
                Menece:
                    - Ranks: [1, 2, 3]
                    - Description: steal food
                Thief:
                    - Ranks: [1, 2, 3]
                    - Description: rob enemy agent, get money
                Military Espionage:
                    - Ranks: [3, 4, 5]
                    - Description: improve research rate
                Tracker:
                    - Ranks: [3, 4, 5]
                    - Description: reveal enemy agents and armies in nearby regions.
                        need enemy agent.
                Sabotour:
                    - Ranks: [5, 6, 7]
                    - Description: armor and damage reduction in region
                Toxic:
                    - Ranks: [5, 5, 7]
                    - Description: casualties while sabotaging supplies
                Discord:
                    - Ranks: [5, 6, 7]
                    - Description: enemy construction and recruitement cost and time increase
            Strategy:
                You probably want to start with Menece first. Then you go for Military Espionage and end with Sabotour.
                Thief is possible in the later stages when Menece is not needed and there is a enemy agent nearby.
                Tracker is nice but is not an active ability, does not help in battle.
                Toxic is based on luck, that is why we use Sabotour instead.
        Note:
            Movement points of cavalry.
            Hunter could be good, but there is nothing to add on top of it, except movement speed.
    Champion:
        Deplyed:
            Useful Skills:
                Explorer:
                    - Ranks: [1, 2, 3]
                    - Description: movement + money from running around
                Intimidating:
                    - Ranks: [1, 2, 3]
                    - Description: minus morale of enemy region
                Terrifying:
                    - Ranks: [3, 4, 5]
                    - Description: reduce enemy morale
                Renowned:
                    - Ranks: [5, 5, 5]
                    - Description: increase melee attack and morale province, public order too.
                Resiurceful:
                    - Ranks: [5, 6, 7]
                    - Description: money from actions
                Heroic:
                    - Ranks: [5, 5, 7]
                    - Description: success on actions
            Strategy:
                Start with Intimidating to get max value. Than one point in Explorer. Then Renowned. 
                Resourceful to make yourself busy while I'm not attacking.
        Note:
            Movement points of infantry.
    Dignitary:
        Parent Army:
            Useful Skills:
                Economist:
                    - Ranks: [1,2,3]
                    - Description: saves max 10% from an upkeep. can be big later in the game
                Chant:
                    - Ranks: [3, 4, 5]
                    - Description: army melee attack and morale
                Smuggler:
                    - Ranks: [5,5,7]
                    - Description: weapon dmg and missile dmg
                Herder:
                    - Ranks: [3, 4,5]
                    - Description: movement and cav upkeep reduction
            Strategy:
                Initially sits with the general to reduce upkeep with Economist.
                Then get Chant and Smuggler to improve fighting capacity.
                Herder can be used if nothing else can be done.
        Deployed:
            Useful Skills:
                Greedy:
                    - Ranks: [ 1, 2, 3 ]
                    - Description: money from enemy region, bad diplomacy
                Orator:
                    - Ranks: [1, 2, 3]
                    - Description: cultural conversion target settlement action
                Leader:
                    - Ranks: [5, 6, 7]
                    - Description: conversion after success action
                Fanatic:
                    - Ranks: [3, 4, 5]
                    - Description: kill people for public order
                Persuasive:
                    - Ranks: [3, 4, 5]
                    - Description: bribe commander ability
                Strict:
                    - Ranks: [ 1, 2, 3 ]
                    - Description: increase taxes much in expense of -3 public order
                Warmonger:
                    - Ranks: [ 3, 4, 5 ]
                    - Description: more recruitment slots in a province in expense of wealth from all sources
            Strategy:
                Probably would want to start with Orator. Then Fanatic. And then Leader. 
                Diplomacy boost is stupid and I really need him to observe the enemy.
        Note:
            Movement points of a siage equipment. That puts parent army use in question.
Generals:
    Useful Skills:
        Tactician:
            - Ranks: [ 2, 4, 6 ]
            - Description: movement and melee def (after 2nd lvl)
        Logistic:
            - Ranks: [3, 5, 7]
            - Description: replenish, ammunition, armor. last lvl ability Battle Rhythm.
        Sentinel:
            - Ranks: [4, 6, 8]
            - Description: def, abilities.
        Warrior:
            - Ranks: [1, 3, 5]
            - Description: melee attack and shots per minute. can use ability later to reduce morale.
        Dread:
            - Ranks: [3, 5, 7]
            - Description: weapon and missile dmg, minus morale
    Strategy:
        The army general should go with Stategist tree, Strategist -> Tactician -> Logistics.
        Then go in Warmonger tree. Dread is must. Take Defense on the way.
        Authority tree is useless. Supporting General can start with Warmonger tree. 
        He will hire mercenaries, which get disbanded end of turn.
    Note:
        Generals ranks are per category, Commander, Strategist or Warmonger.
Tech:
    - Supply Foraging: provides more ammunition which is super important
    - Emergency Measures: to get archers

    - Celtic Fields Systems:
    - Earth Works: growth
    - Under Floor Drainage: growth + -1 const time for major and minor capitals

    - Advanced Saddle: can have horses
    - Headhunt:
    - Cavalry Tactics:
    - Infantry Chainmail: better units

    - Knowledge of the Oak:
    - Mint:
    - Cupellation Furnace: to get dignitary

Buildings:
    Province development depends on proximity to danger.
    
    The closest regions to danger should have only garnison buildings or temples. 
    Don't develop settlements much. Must be able to hire staple troops.
    Next, with less danger start leveling up head buildings.
    Next, the requirement is to just be able to hire staple troops.
    Finally, in the deep rear we build exact buildings for max profit.

Game:
    It's OK to release troops. It's important to have troops proportional to the threat.
    In the mid game there is a feel of vast superiority. But it's an illusion
    since you are still capped by army count. That can turn ugly if you become 
    at war with many nations at once.

Battle:
    Battle tactics should take into account superior AI forces. User should 
    use advanced tactics as much as possible to survive.
    
    Staple army composition is two spear units, everything else is archers and one
    shock cav general.
    
    The formation is to have two spear units on the sides to take over enemy cav. 
    More spear units needed with more enemy cav. In the center in the long line are 
    archers. Archers are in the skirmish mode and spread out the enemy. Shock cav general 
    should avoid any losing confrontation. Spear units should defend general unit 
    from the enemy cav. The goal of the general is to take down enemy missile units.
    
    The composition have a downside that it can't take down forces much larger in quantities. 
    In that case it's hard to have a missile unit not be pursued by the enemy. But the AI 
    usually treat that unit composition as weak and doesn't dispatch multistack armies against it. 
     
    Use spear/sword unit generals for defense and other party sword unit for castle offense.
    
    To fight off horse archer armies, it's useful to have an artillary.
    
    Another field battle composition is placing spear units on one side and archers/skirmishers on the
    other side. General is being on the latter side too. The idea is too flank with spear units from one side.
    Enemy infantry will regroup to face flanking units. In the meantime missile units should free themselves 
    to shoot in the back of the enemy. Shock cav general should take out enemy missile units.
    This strategy could be hard to implement in case enemy has superior cav units. 
    heavy skirmishers should be able take them on though.